<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#285c43"><title>Focus · 任务看板演示</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="demo.css"><script src="demo.js" defer></script></head><body><header><a href="index.html">← 黄祥云的作品集</a><span>本站演示项目 · 数据仅保存于当前浏览器</span></header><main><div class="heading"><div><p class="label">FOCUS / PERSONAL WORKSPACE</p><h1>今天，专注重要的事。</h1><p>把想法拆成行动，让每一步都看得见。</p></div><span class="mark">f.</span></div><section class="stats" aria-label="任务统计"><div><span>全部任务</span><b id="total">0</b></div><div><span>进行中</span><b id="active">0</b></div><div><span>已完成</span><b id="done">0</b></div></section><section class="toolbar" aria-label="添加和搜索任务"><form id="task-form"><label class="sr" for="task-title">任务名称</label><input id="task-title" name="title" maxlength="80" placeholder="下一件重要的事是什么？" required><label class="sr" for="task-category">任务类别</label><select id="task-category" name="category"><option>开发</option><option>设计</option><option>学习</option></select><button class="primary" type="submit">＋ 添加任务</button></form><label class="search"><span class="sr">搜索任务</span><input id="search" type="search" placeholder="搜索任务…" maxlength="80"></label></section><p id="status" role="status" aria-live="polite"></p><div class="board"><section class="column"><h2><span class="dot"></span>待开始 <small id="todo-count"></small></h2><div id="todo" class="task-list"></div></section><section class="column"><h2><span class="dot active"></span>进行中 <small id="doing-count"></small></h2><div id="doing" class="task-list"></div></section><section class="column"><h2><span class="dot done"></span>已完成 <small id="done-count"></small></h2><div id="completed" class="task-list"></div></section></div><footer><span>原生 JavaScript · 本地存储 · 响应式布局</span><button id="reset" type="button">重置演示数据</button></footer><p class="note">这是交互功能演示，不连接业务后台。清除浏览器数据会移除保存的任务；请勿在此保存重要或敏感信息。</p></main></body></html>
